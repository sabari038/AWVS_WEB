<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Vulnerability Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Fallback if external CSS fails or needs override */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <h1>🛡️ Agentless Scanner <span
                    style="font-size: 0.8rem; background: var(--accent); color: black; padding: 2px 6px; border-radius: 4px; vertical-align: middle;">v2.0
                    (Live)</span></h1>
        </div>
        <nav>
            <ul>
                <li><a href="/">Dashboard</a></li>
                <li><a href="/history">History</a></li>
                <li><a href="/settings">Settings</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        // Common helper for submitting forms
        async function runScan(endpoint, formId, resultId) {
            const form = document.getElementById(formId);
            const resultDiv = document.getElementById(resultId);
            const spinner = form.querySelector('.spinner');

            spinner.style.display = 'block';
            resultDiv.innerHTML = '<p style="color: #94a3b8; text-align: center;">Scan in progress...</p>';

            const formData = new FormData(form);

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Simple JSON pretty print for now, can be improved to HTML table in future
                resultDiv.innerHTML = JSON.stringify(data, null, 2);

                // Just for better UX, scroll to result
                resultDiv.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                resultDiv.innerHTML = `<span class="status-down">Error: ${error.message}</span>`;
            } finally {
                spinner.style.display = 'none';
            }
        }
    </script>
</body>

</html>
